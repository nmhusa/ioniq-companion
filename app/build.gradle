plugins { id 'com.android.application' }
def privateConfig = new Properties()
def privateFile = rootProject.file('local-api.properties')
if (privateFile.exists()) { privateFile.withInputStream { privateConfig.load(it) } }
def apiCredential = System.getenv('HYUNDAI_CLIENT_SECRET') ?: privateConfig.getProperty('hyundaiClientSecret', '')
android {
 buildFeatures { buildConfig true }
 namespace 'com.ioniq.widget'
 compileSdk 35
 defaultConfig { testInstrumentationRunner 'com.ioniq.widget.SecurityInstrumentation'; buildConfigField 'String', 'HYUNDAI_CLIENT_SECRET', groovy.json.JsonOutput.toJson(apiCredential); applicationId 'com.ioniq.widget'; minSdk 26; targetSdk 34; versionCode 21; versionName '0.8.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation project(':shared'); implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
