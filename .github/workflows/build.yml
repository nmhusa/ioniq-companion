name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test automatic Bluetooth lock decisions
        run: |
          mkdir -p /tmp/parking-tests
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/BluetoothLockRules.java tests/BluetoothLockRulesTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.BluetoothLockRulesTest
      - name: Test mileage parsing
        run: |
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/MileageReading.java tests/MileageReadingTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.MileageReadingTest
      - name: Test vehicle model identification
        run: |
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/ModelName.java tests/ModelNameTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.ModelNameTest
      - name: Test climate heat modes
        run: |
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/ClimateHeatMode.java tests/ClimateHeatModeTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.ClimateHeatModeTest
      - name: Test charge-limit validation and AC/DC mapping
        run: |
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/ChargeLimitValues.java tests/ChargeLimitValuesTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.ChargeLimitValuesTest
      - name: Test coordinate validation and map links
        run: |
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/GeoPoint.java tests/GeoPointTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.GeoPointTest
      - name: Test widget feedback and interrupted-command presentation
        run: |
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/WidgetFeedback.java tests/WidgetFeedbackTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.WidgetFeedbackTest
      - name: Test authenticated cache encryption, single-use unlock permits and error redaction
        run: |
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/CacheCipher.java app/src/main/java/com/ioniq/widget/OneShotPermit.java app/src/main/java/com/ioniq/widget/ErrorText.java tests/SecurityTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.SecurityTest
      - name: Test distinct light/horn endpoints and polling compatibility
        run: |
          mkdir -p /tmp/signal-tests
          javac -d /tmp/signal-tests app/src/main/java/com/ioniq/widget/VehicleSignal.java tests/VehicleSignalTest.java
          java -cp /tmp/signal-tests com.ioniq.widget.VehicleSignalTest
      - name: Test watch command allowlist, freshness and IDs
        run: |
          mkdir -p /tmp/watch-tests
          javac -d /tmp/watch-tests shared/src/main/java/com/ioniq/common/WatchProtocol.java tests/WatchProtocolTest.java
          java -cp /tmp/watch-tests com.ioniq.common.WatchProtocolTest
      - name: Test credential decoder
        run: |
          mkdir -p /tmp/credential-tests
          javac -d /tmp/credential-tests app/src/main/java/com/ioniq/widget/ClientCredential.java tests/ClientCredentialTest.java
          java -cp /tmp/credential-tests com.ioniq.widget.ClientCredentialTest
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          cmdline-tools-version: '13114758' 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease :wear:assembleDebug :wear:lintDebug :wear:assembleRelease :wear:lintRelease
        env:
          HYUNDAI_CLIENT_SECRET: CI_SYNTHETIC_CREDENTIAL_DO_NOT_USE_081
      - name: Verify release obfuscation and no plaintext sentinel
        run: python tests/check_release_obfuscation.py
      - name: Rebuild credential-free debug artifacts
        run: gradle --no-daemon :app:assembleDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IONIQ6-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows build and update scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Output $_ }; $failed = $true }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }
      - name: Test updater migration without credentials or network
        shell: powershell
        run: |
          .\tests\UpdateMigrationTest.ps1
          .\tests\WatchBuildMigrationTest.ps1
          .\tests\CredentialMigrationTest.ps1

  android-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          cmdline-tools-version: '13114758'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Build instrumented security checks
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :wear:assembleDebug :wear:assembleDebugAndroidTest :app:assembleRelease :wear:assembleRelease
      - name: Sign obfuscated APKs with disposable CI key for smoke tests
        run: |
          keytool -genkeypair -keystore /tmp/ci-smoke.p12 -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable CI Test'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks /tmp/ci-smoke.p12 --ks-pass pass:android --key-pass pass:android --out /tmp/phone-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks /tmp/ci-smoke.p12 --ks-pass pass:android --key-pass pass:android --out /tmp/watch-release.apk wear/build/outputs/apk/release/wear-release-unsigned.apk
      - name: Exercise encrypted migration on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.ioniq.widget.test/com.ioniq.widget.SecurityInstrumentation | tee /tmp/security-instrumentation.txt
            adb logcat -d -s AndroidRuntime:E
            grep -q 'security_result=PASS:' /tmp/security-instrumentation.txt
            adb uninstall com.ioniq.widget.test
            adb uninstall com.ioniq.widget
            adb shell wm size 450x450
            adb shell wm density 320
            adb install -r wear/build/outputs/apk/debug/wear-debug.apk
            adb install -r wear/build/outputs/apk/androidTest/debug/wear-debug-androidTest.apk
            adb shell am instrument -w com.ioniq.widget.test/com.ioniq.watch.WatchInstrumentation | tee /tmp/watch-instrumentation.txt
            grep -q 'watch_result=PASS:' /tmp/watch-instrumentation.txt
            adb uninstall com.ioniq.widget.test
            adb uninstall com.ioniq.widget
            adb install /tmp/phone-release.apk
            adb shell am start -W -n com.ioniq.widget/.LauncherActivity
            sleep 3
            adb shell pidof com.ioniq.widget
            adb uninstall com.ioniq.widget
            adb install /tmp/watch-release.apk
            adb shell am start -W -n com.ioniq.widget/com.ioniq.watch.WatchActivity
            sleep 3
            adb shell pidof com.ioniq.widget
