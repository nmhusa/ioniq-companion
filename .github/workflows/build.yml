name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test parking decisions
        run: |
          mkdir -p /tmp/parking-tests
          javac -d /tmp/parking-tests app/src/main/java/com/ioniq/widget/ParkingRules.java tests/ParkingRulesTest.java
          java -cp /tmp/parking-tests com.ioniq.widget.ParkingRulesTest
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          cmdline-tools-version: '13114758' 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IONIQ6-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
